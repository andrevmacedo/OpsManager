<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Operações</title>
</head>
<body>
    <h1>Operações</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for op in operacoes %}
            <tr>
                <td>{{ op['id'] }}</td>
                <td>{{ op['nome'] }}</td>
                <td>{{ op['descricao'] }}</td>
                <td>{{ op['status'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
